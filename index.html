<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrosys - Início</title>
    <link rel="stylesheet" href="./css/login.css"> 
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alasql@latest"></script>
    <script src="../js/db.js"></script>
    <script src="../js/app.js"></script>
</head>
<header>
    <button id="btnConfiguracao" class="btn_configuracao">Configuração</button>
</header>
<body>
<div class="login_container">
            
            <h1>Agrosys</h1>
            
            <p>Insira suas credenciais para continuar</p>
            
            <form>
                
                <div class="input_login">
                    <label for="usuario">Email</label>
                    <input type="email" id="usuario" name="usuario" placeholder="Insira seu Email" required>
                </div>
                
                <div class="input_login">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Insira sua senha" required>
                </div>
                
                <button type="submit" class="btn_login" onclick="handleLogin(event)">Login</button>
            
            </form>
            
            <div class='footer_text'>Não tem uma conta? </div>
            
            <div class="cadastre_se_link">
                <a id="cadastre_se">Cadastre-se</a>
            </div>
        
</div>
    
<div id="modal_cadastro" class="modal_cadastro">
        
        <div class="container_cadastro">
            
            <a id="btnFechar">X</a>
            <h1>Cadastro</h1>
        
        <form>
            
            <div class="input_cadastro">
                <label for="nome_cadastro">Nome completo</label>
                <input type="text" id="nome_cadastro" name="nome_cadastro" placeholder="Digite seu nome completo" required>
            </div>
            
            <div class="input_cadastro">
                <label for="email_cadastro">E-mail</label>
                <input type="email" id="email_cadastro" name="email_cadastro" placeholder="seu@email.com" required>
            </div>
            
            <div class="input_cadastro">
                <label for="senha_cadastro">Senha</label>
                <input type="password" id="senha_cadastro" name="senha_cadastro" placeholder="Digite uma senha" required>
            </div>
            
            <div class="input_cadastro">
                <label for="confirmar_senha">Confirmar Senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirme sua senha" required>
            </div>
            
            <div class="cadastro_btn">  
                <button type="submit" onclick="validarSenha(event)">Cadastrar</button>
            </div>
        
        </form>
        
        <div class="footer_cadastro">Já tem conta? <a href="index.html" class="return_login">Faça login</a></div>
    
    </div>
  
</div>

<div id="modal_configuracao" class="modal_configuracao">
    
    <div class="modal_conteudo_configuracao">
        
        <button id="btnFecharConfig" class="btn_fechar" aria-label="Fechar modal">x</button>
        
        <h1>Configurações</h1>
        
        <p class="modal_text">Envie um arquivo JSON para pré-popular o banco de dados.</p>
        
        <form id="formUploadJson">
        
            <div class="config_group">
                <label for="arquivo_json">Arquivo JSON do banco</label>
                <input type="file" id="arquivo_json" name="arquivo_json" accept="application/json,.json" required>
            </div>
        
            <button type="submit" class="btn_upload">Carregar JSON</button>
        </form>
        
        <p class="modal_note">O arquivo precisa ser um JSON válido com os dados do banco.</p>
    
    </div>

</div>


</body>

</html>
